<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Sedang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .card {
            background-color: #ffffff;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3498db;
            margin-bottom: 15px;
        }
        
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        th,
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
        }
        
        th {
            color: #555;
            width: 40%;
        }
        
        td {
            color: #333;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- Tambahkan class="profile-img" di baris ini -->
        <img src="sintia.jpg" alt="Foto Profil" class="profile-img">

        <h2>Biodata Diri</h2>

        <table>
            <tr>
                <th>Nama</th>
                <td>Sintia Nurhalima</td>
            </tr>
            <tr>
                <th>Tanggal Lahir</th>
                <td>17 MARET 2010</td>
            </tr>
            <tr>
                <th>Alamat</th>
                <td>KLATAKAAN</td>
            </tr>
            <tr>
                <th>Kelas</th>
                <td>XI RPL 1</td>
            </tr>
            <tr>
                <th>Hobi</th>
                <td>Shooping</td>
            </tr>
            <tr>
                <th>Cita-cita</th>
                <td>Bos Muda</td>
            </tr>
        </table>
    </div>

</body>

</html>
