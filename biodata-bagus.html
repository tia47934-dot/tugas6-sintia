<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Super Bagus & Modern</title>
    <!-- Import Font Modern & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            /* Latar Belakang Gradasi Warna Modern */
            background: linear-gradient(135deg, #69b4ee 0%, #5eb8e4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* Kartu Utama dengan Efek Transisi dan Shadow Melayang */
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            width: 380px;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        /* Efek Hover Transition pada Kartu */
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
        }
        /* Dekorasi Hiasan Atas Kartu */
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #5c70e2, #300f7f);
        }
        /* Wrapper Foto Profil dengan Efek Glowing */
        
        .profile-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
        }
        
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
            transition: transform 0.5s ease;
        }
        /* Efek Hover Transition pada Foto Profil */
        
        .card:hover .profile-img {
            transform: scale(1.08) rotate(3deg);
        }
        
        h2 {
            color: #2d3748;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .subtitle {
            color: #718096;
            font-size: 13px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        /* Baris Informasi Bergaya Item Modern */
        
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            background: #f7fafc;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #edf2f7;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        /* Efek Hover pada Setiap Item Data */
        
        .info-item:hover {
            background: #edf2f7;
            transform: translateX(5px);
        }
        
        .info-item i {
            font-size: 16px;
            color: #667eea;
            width: 30px;
            text-align: center;
            margin-right: 12px;
        }
        
        .info-content {
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            font-size: 11px;
            color: #a0aec0;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .info-value {
            font-size: 14px;
            color: #2d3748;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="profile-wrapper">
            <img src="sintia.jpg" alt="Foto Profil" class="profile-img">
        </div>

        <h2>Sintia Nurhalima</h2>
        <p class="subtitle">Siswa RPL</p>

        <div class="info-list">
            <div class="info-item">
                <i class="fa-solid fa-calendar-days"></i>
                <div class="info-content">
                    <span class="info-label">Tanggal Lahir</span>
                    <span class="info-value">17 MARET 2010</span>
                </div>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <div class="info-content">
                    <span class="info-label">Alamat</span>
                    <span class="info-value">KLATAKAAN</span>
                </div>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-graduation-cap"></i>
                <div class="info-content">
                    <span class="info-label">Kelas</span>
                    <span class="info-value">XI RPL 1</span>
                </div>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-heart"></i>
                <div class="info-content">
                    <span class="info-label">Hobi</span>
                    <span class="info-value">Shooping</span>
                </div>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-briefcase"></i>
                <div class="info-content">
                    <span class="info-label">Cita-cita</span>
                    <span class="info-value">Bos Muda</span>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
